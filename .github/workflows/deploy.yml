name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      # @urology-ai/epsa-engine lives in the private GitHub Packages registry;
      # frontend-react/.npmrc reads this token from the environment.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EPSA_ENGINE_DEPLOY_KEY }}

      - name: Build
        run: npm run build
        working-directory: frontend-react

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
